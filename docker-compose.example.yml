services:
  writing-mcp:
    build: .
    user: "${WRITING_UID:-1000}:${WRITING_GID:-1000}"
    environment:
      WRITING_SYNC_DIR: /sync
      DB_PATH: /data/writing.db
      HTTP_PORT: "3000"
      OWNERSHIP_GUARD_MODE: "${OWNERSHIP_GUARD_MODE:-warn}"
      MCP_TRANSPORT: http
      # For private Git remotes, uncomment this and mount /ssh read-only below.
      # GIT_SSH_COMMAND: "ssh -i /ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/ssh/known_hosts"
    ports:
      - "${WRITING_HTTP_PORT:-3000}:3000"
    volumes:
      - ${WRITING_SYNC_DIR_HOST:-./sync}:/sync
      - ${WRITING_DATA_DIR_HOST:-./data}:/data
      # Optional private Git remote credentials:
      # - ${WRITING_SSH_DIR_HOST:-./ssh}:/ssh:ro
    healthcheck:
      test: ["CMD", "node", "-e", "const port=process.env.HTTP_PORT||3000; fetch('http://127.0.0.1:'+port+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
