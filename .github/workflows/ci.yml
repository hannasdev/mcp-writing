name: CI

on:
  push:
    branches:
      - main
      - release-please--branches--**
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  static-checks:
    name: Static Checks
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check for legacy root-module imports
        run: npm run guard:legacy-root-imports

      - name: Regenerate tool reference
        run: npm run docs

      - name: Verify generated docs are committed
        run: git diff --exit-code -- docs/agents/tools.md

  docker:
    name: Docker
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t mcp-writing:ci .

      - name: Start container
        run: |
          mkdir -p "$RUNNER_TEMP/mcp-writing-sync" "$RUNNER_TEMP/mcp-writing-data"
          docker run -d \
            --name mcp-writing-ci \
            --user "$(id -u):$(id -g)" \
            -p 127.0.0.1:3000:3000 \
            -v "$RUNNER_TEMP/mcp-writing-sync:/sync" \
            -v "$RUNNER_TEMP/mcp-writing-data:/data" \
            -e OWNERSHIP_GUARD_MODE=warn \
            mcp-writing:ci

      - name: Wait for health check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs mcp-writing-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f mcp-writing-ci || true
